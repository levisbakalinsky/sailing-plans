name: Deploy Development

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "deploy/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:
    inputs:
      component:
        description: Which component to deploy
        required: true
        type: choice
        default: all
        options:
          - all
          - api
          - web
          - proxy

concurrency:
  # One rolling deploy at a time against the shared Droplet pool.
  group: deploy-dev-pool
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/sailing-plans
  APP_DIR: /opt/sailing-plans
  POOL_TAG: sailing-plans-app-dev-pool

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.select.outputs.api }}
      web: ${{ steps.select.outputs.web }}
      proxy: ${{ steps.select.outputs.proxy }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Detect path changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
            proxy:
              - 'deploy/Caddyfile'
              - 'deploy/docker-compose.yml'
              - 'deploy/bootstrap.sh'
              - 'deploy/scripts/**'

      - name: Resolve components
        id: select
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            component="${{ github.event.inputs.component }}"
            api=false; web=false; proxy=false
            case "$component" in
              all) api=true; web=true; proxy=true ;;
              api) api=true ;;
              web) web=true ;;
              proxy) proxy=true ;;
            esac
          else
            api=${{ steps.filter.outputs.api || 'false' }}
            web=${{ steps.filter.outputs.web || 'false' }}
            proxy=${{ steps.filter.outputs.proxy || 'false' }}
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "proxy=$proxy" >> "$GITHUB_OUTPUT"
          echo "Deploy selection → api=$api web=$web proxy=$proxy"

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha_tag="${GITHUB_SHA::12}"
          echo "image=${IMAGE_PREFIX}-api:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_PREFIX}-api:dev" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha_tag="${GITHUB_SHA::12}"
          echo "image=${IMAGE_PREFIX}-web:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_PREFIX}-web:dev" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=web-dev
          cache-to: type=gha,mode=max,scope=web-dev

  deploy-api:
    needs: [changes, build-api]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy API to all pool hosts
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          API_IMAGE: ${{ needs.build-api.outputs.image }}
          POOL_TAG: ${{ vars.POOL_TAG || 'sailing-plans-app-dev-pool' }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh

          ./deploy/scripts/ssh-pool.sh -- "$(cat <<EOF
          set -euo pipefail
          cd /opt/sailing-plans
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          grep -vE '^API_IMAGE=' .env > .env.tmp || true
          { cat .env.tmp; echo "API_IMAGE=${API_IMAGE}"; } > .env
          rm -f .env.tmp
          chmod 600 .env
          docker compose pull api
          docker compose up -d --no-deps --remove-orphans api
          for i in \$(seq 1 45); do
            if curl -fsS http://127.0.0.1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API health check failed"
          docker compose logs --tail=80 api
          exit 1
          EOF
          )"

          ./deploy/scripts/ssh-pool.sh --first-only -- "$(cat <<'EOF'
          set -euo pipefail
          cd /opt/sailing-plans
          docker compose exec -T api npx prisma migrate deploy
          EOF
          )"

      - name: Verify via load balancer
        env:
          LB_HOST: ${{ secrets.LOADBALANCER_IP }}
          FALLBACK_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          set -euo pipefail
          host="${LB_HOST:-$FALLBACK_HOST}"
          if [[ -z "$host" ]]; then
            echo "Set LOADBALANCER_IP (or DROPLET_HOST) in the development environment" >&2
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -fsS "http://${host}/health"; then
              exit 0
            fi
            sleep 2
          done
          echo "LB health check failed for ${host}"
          exit 1

  deploy-web:
    needs: [changes, build-web, deploy-api]
    if: |
      always()
      && needs.changes.outputs.web == 'true'
      && needs.build-web.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy Web to all pool hosts
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          WEB_IMAGE: ${{ needs.build-web.outputs.image }}
          POOL_TAG: ${{ vars.POOL_TAG || 'sailing-plans-app-dev-pool' }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/ssh-pool.sh -- "$(cat <<EOF
          set -euo pipefail
          cd /opt/sailing-plans
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          grep -vE '^WEB_IMAGE=' .env > .env.tmp || true
          { cat .env.tmp; echo "WEB_IMAGE=${WEB_IMAGE}"; } > .env
          rm -f .env.tmp
          chmod 600 .env
          docker compose pull web
          docker compose up -d --no-deps --remove-orphans web
          for i in \$(seq 1 45); do
            code="\$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/ || true)"
            if [[ "\$code" == "200" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "Web health check failed"
          docker compose logs --tail=80 web
          exit 1
          EOF
          )"

      - name: Verify via load balancer
        env:
          LB_HOST: ${{ secrets.LOADBALANCER_IP }}
          FALLBACK_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          set -euo pipefail
          host="${LB_HOST:-$FALLBACK_HOST}"
          if [[ -z "$host" ]]; then
            echo "Set LOADBALANCER_IP (or DROPLET_HOST) in the development environment" >&2
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://${host}/"; then
              exit 0
            fi
            sleep 2
          done
          echo "LB web check failed for ${host}"
          exit 1

  deploy-proxy:
    needs: [changes, deploy-api, deploy-web]
    if: |
      always()
      && needs.changes.outputs.proxy == 'true'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      && (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync compose + Caddyfile to all pool hosts
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          POOL_TAG: ${{ vars.POOL_TAG || 'sailing-plans-app-dev-pool' }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          KEY_PATH="$(mktemp)"
          printf '%s\n' "$DROPLET_SSH_KEY" >"$KEY_PATH"
          chmod 600 "$KEY_PATH"
          mapfile -t HOSTS < <(./deploy/scripts/pool-hosts.sh)
          if [[ "${#HOSTS[@]}" -eq 0 ]]; then
            echo "No pool hosts for tag $POOL_TAG" >&2
            exit 1
          fi
          for host in "${HOSTS[@]}"; do
            echo "Syncing to $host"
            scp -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes \
              -i "$KEY_PATH" \
              deploy/docker-compose.yml deploy/Caddyfile \
              "${DROPLET_USER}@${host}:/opt/sailing-plans/"
          done
          rm -f "$KEY_PATH"

          ./deploy/scripts/ssh-pool.sh -- "$(cat <<'EOF'
          set -euo pipefail
          cd /opt/sailing-plans
          # Force recreate so an updated bind-mounted Caddyfile is loaded (compose up alone won't reload).
          docker compose up -d --no-deps --force-recreate --remove-orphans caddy
          docker compose rm -sf db 2>/dev/null || true
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Proxy health check failed"
          docker compose logs --tail=80 caddy
          exit 1
          EOF
          )"

      - name: Verify via load balancer
        env:
          LB_HOST: ${{ secrets.LOADBALANCER_IP }}
          FALLBACK_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          set -euo pipefail
          host="${LB_HOST:-$FALLBACK_HOST}"
          if [[ -z "$host" ]]; then
            echo "Set LOADBALANCER_IP (or DROPLET_HOST) in the development environment" >&2
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -fsS "http://${host}/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "LB health check failed for ${host}"
          exit 1
