name: Deploy Development

# Blue/green application deploy.
# Run Migrate Development separately before this when schema changes.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      # Only app runtime config — not deploy/scripts (ops helpers must not recreate idle pools).
      - "deploy/docker-compose.yml"
      - "deploy/Caddyfile"
      - "deploy/bootstrap.sh"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:
    inputs:
      component:
        description: Which component to deploy
        required: true
        type: choice
        default: all
        options:
          - all
          - api
          - web
          - proxy
      finalize:
        description: After cutover, delete the old color (disables instant rollback)
        type: boolean
        default: false
      skip_cutover:
        description: Deploy to inactive color only (no LB flip) — then use Release Development → forward
        type: boolean
        default: false

concurrency:
  group: deploy-dev-pool
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/sailing-plans
  APP_DIR: /opt/sailing-plans
  POOL_TAG: ${{ vars.POOL_TAG || 'sailing-plans-app-dev-pool' }}
  BLUE_TAG: ${{ vars.BLUE_TAG || 'sailing-plans-app-dev-pool-blue' }}
  GREEN_TAG: ${{ vars.GREEN_TAG || 'sailing-plans-app-dev-pool-green' }}
  BASELINE_MIN: ${{ vars.BASELINE_MIN || '2' }}
  LOADBALANCER_ID: ${{ vars.LOADBALANCER_ID }}
  AUTOSCALE_POOL_ID_BLUE: ${{ vars.AUTOSCALE_POOL_ID_BLUE }}
  AUTOSCALE_POOL_ID_GREEN: ${{ vars.AUTOSCALE_POOL_ID_GREEN }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.select.outputs.api }}
      web: ${{ steps.select.outputs.web }}
      proxy: ${{ steps.select.outputs.proxy }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Detect path changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
            proxy:
              - 'deploy/Caddyfile'
              - 'deploy/docker-compose.yml'
              - 'deploy/bootstrap.sh'
              - 'deploy/scripts/**'

      - name: Resolve components
        id: select
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            component="${{ github.event.inputs.component }}"
            api=false; web=false; proxy=false
            case "$component" in
              all) api=true; web=true; proxy=true ;;
              api) api=true ;;
              web) web=true ;;
              proxy) proxy=true ;;
            esac
          else
            api=${{ steps.filter.outputs.api || 'false' }}
            web=${{ steps.filter.outputs.web || 'false' }}
            proxy=${{ steps.filter.outputs.proxy || 'false' }}
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "proxy=$proxy" >> "$GITHUB_OUTPUT"
          echo "Deploy selection → api=$api web=$web proxy=$proxy"

  resolve-colors:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.proxy == 'true'
    runs-on: ubuntu-latest
    environment: development
    outputs:
      active_tag: ${{ steps.colors.outputs.active_tag }}
      inactive_tag: ${{ steps.colors.outputs.inactive_tag }}
      inactive_pool_id: ${{ steps.colors.outputs.inactive_pool_id }}
      active_pool_id: ${{ steps.colors.outputs.active_pool_id }}
      inactive_pool_name: ${{ steps.colors.outputs.inactive_pool_name }}
      baseline_min: ${{ steps.colors.outputs.baseline_min }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve active / inactive colors
        id: colors
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          LOADBALANCER_ID: ${{ env.LOADBALANCER_ID }}
          POOL_TAG: ${{ env.POOL_TAG }}
          BLUE_TAG: ${{ env.BLUE_TAG }}
          GREEN_TAG: ${{ env.GREEN_TAG }}
          AUTOSCALE_POOL_ID_BLUE: ${{ env.AUTOSCALE_POOL_ID_BLUE }}
          AUTOSCALE_POOL_ID_GREEN: ${{ env.AUTOSCALE_POOL_ID_GREEN }}
          BASELINE_MIN: ${{ env.BASELINE_MIN }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          for req in LOADBALANCER_ID AUTOSCALE_POOL_ID_BLUE AUTOSCALE_POOL_ID_GREEN; do
            if [[ -z "${!req}" ]]; then
              echo "$req must be set (GitHub Actions variable). Apply Terraform blue/green first." >&2
              exit 1
            fi
          done
          active="$(./deploy/scripts/lb-get-tag.sh)"
          if [[ -z "$active" ]]; then
            echo "LB has no droplet_tag; defaulting to blue" >&2
            active="$BLUE_TAG"
          fi
          # During the first blue/green cutover the LB may still use the shared pool tag.
          if [[ "$active" == "$POOL_TAG" ]]; then
            echo "LB still on shared pool tag; treating as blue" >&2
            active="$BLUE_TAG"
          fi
          if [[ "$active" == "$BLUE_TAG" ]]; then
            inactive="$GREEN_TAG"
            inactive_pool="$AUTOSCALE_POOL_ID_GREEN"
            active_pool="$AUTOSCALE_POOL_ID_BLUE"
            inactive_name="sailing-plans-app-dev-green"
          elif [[ "$active" == "$GREEN_TAG" ]]; then
            inactive="$BLUE_TAG"
            inactive_pool="$AUTOSCALE_POOL_ID_BLUE"
            active_pool="$AUTOSCALE_POOL_ID_GREEN"
            inactive_name="sailing-plans-app-dev"
          else
            echo "Unexpected LB tag '$active' (expected $BLUE_TAG or $GREEN_TAG)" >&2
            exit 1
          fi
          echo "active_tag=$active" >> "$GITHUB_OUTPUT"
          echo "inactive_tag=$inactive" >> "$GITHUB_OUTPUT"
          echo "inactive_pool_id=$inactive_pool" >> "$GITHUB_OUTPUT"
          echo "active_pool_id=$active_pool" >> "$GITHUB_OUTPUT"
          echo "inactive_pool_name=$inactive_name" >> "$GITHUB_OUTPUT"
          echo "baseline_min=$BASELINE_MIN" >> "$GITHUB_OUTPUT"
          echo "Active=$active Inactive=$inactive"

  scale-inactive:
    needs: [changes, resolve-colors]
    runs-on: ubuntu-latest
    environment: development
    outputs:
      inactive_pool_id: ${{ steps.ensure.outputs.inactive_pool_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Ensure inactive pool + scale to baseline
        id: ensure
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          POOL_ID: ${{ needs.resolve-colors.outputs.inactive_pool_id }}
          POOL_NAME: ${{ needs.resolve-colors.outputs.inactive_pool_name }}
          COLOR_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
          SHARED_TAG: ${{ env.POOL_TAG }}
          CLONE_FROM: ${{ needs.resolve-colors.outputs.active_pool_id }}
          MIN: ${{ needs.resolve-colors.outputs.baseline_min }}
          INACTIVE_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
          GREEN_TAG: ${{ env.GREEN_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          # Recreate inactive pool if a prior finalize deleted it (DO cannot keep min=0).
          out="$(./deploy/scripts/autoscale-ensure.sh \
            "$POOL_ID" "$POOL_NAME" "$COLOR_TAG" "$SHARED_TAG" "$CLONE_FROM" "$MIN")"
          echo "$out"
          new_id="$(sed -n 's/^pool_id=//p' <<<"$out" | tail -n1)"
          echo "inactive_pool_id=$new_id" >> "$GITHUB_OUTPUT"
          # Best-effort refresh of the color pool id variable for next runs.
          if [[ "$COLOR_TAG" == "$GREEN_TAG" ]]; then
            gh variable set AUTOSCALE_POOL_ID_GREEN --env development --body "$new_id" || true
          else
            gh variable set AUTOSCALE_POOL_ID_BLUE --env development --body "$new_id" || true
          fi
          ./deploy/scripts/wait-pool-hosts.sh "$INACTIVE_TAG" "$MIN" 900

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha_tag="${GITHUB_SHA::12}"
          echo "image=${IMAGE_PREFIX}-api:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_PREFIX}-api:dev" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha_tag="${GITHUB_SHA::12}"
          echo "image=${IMAGE_PREFIX}-web:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_PREFIX}-web:dev" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=web-dev
          cache-to: type=gha,mode=max,scope=web-dev

  deploy-api:
    needs: [changes, resolve-colors, scale-inactive, build-api]
    if: |
      always()
      && needs.changes.outputs.api == 'true'
      && needs.build-api.result == 'success'
      && needs.scale-inactive.result == 'success'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy API to inactive color
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          API_IMAGE: ${{ needs.build-api.outputs.image }}
          POOL_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/ssh-pool.sh -- "$(cat <<EOF
          set -euo pipefail
          cd /opt/sailing-plans
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          grep -vE '^API_IMAGE=' .env > .env.tmp || true
          { cat .env.tmp; echo "API_IMAGE=${API_IMAGE}"; } > .env
          rm -f .env.tmp
          chmod 600 .env
          docker compose pull api
          docker compose up -d --no-deps --remove-orphans api
          for i in \$(seq 1 45); do
            if curl -fsS http://127.0.0.1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API health check failed"
          docker compose logs --tail=80 api
          exit 1
          EOF
          )"

  deploy-web:
    needs: [changes, resolve-colors, scale-inactive, build-web, deploy-api]
    if: |
      always()
      && needs.changes.outputs.web == 'true'
      && needs.build-web.result == 'success'
      && needs.scale-inactive.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy Web to inactive color
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          WEB_IMAGE: ${{ needs.build-web.outputs.image }}
          POOL_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/ssh-pool.sh -- "$(cat <<EOF
          set -euo pipefail
          cd /opt/sailing-plans
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          grep -vE '^WEB_IMAGE=' .env > .env.tmp || true
          { cat .env.tmp; echo "WEB_IMAGE=${WEB_IMAGE}"; } > .env
          rm -f .env.tmp
          chmod 600 .env
          docker compose pull web
          docker compose up -d --no-deps --remove-orphans web
          for i in \$(seq 1 45); do
            code="\$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/ || true)"
            if [[ "\$code" == "200" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "Web health check failed"
          docker compose logs --tail=80 web
          exit 1
          EOF
          )"

  deploy-proxy:
    needs: [changes, resolve-colors, scale-inactive, deploy-api, deploy-web]
    if: |
      always()
      && needs.changes.outputs.proxy == 'true'
      && needs.scale-inactive.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      && (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync compose + Caddyfile to inactive color
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          POOL_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          KEY_PATH="$(mktemp)"
          printf '%s\n' "$DROPLET_SSH_KEY" >"$KEY_PATH"
          chmod 600 "$KEY_PATH"
          mapfile -t HOSTS < <(./deploy/scripts/pool-hosts.sh)
          if [[ "${#HOSTS[@]}" -eq 0 ]]; then
            echo "No pool hosts for tag $POOL_TAG" >&2
            exit 1
          fi
          for host in "${HOSTS[@]}"; do
            echo "Syncing to $host"
            scp -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes \
              -i "$KEY_PATH" \
              deploy/docker-compose.yml deploy/Caddyfile \
              "${DROPLET_USER}@${host}:/opt/sailing-plans/"
          done
          rm -f "$KEY_PATH"

          ./deploy/scripts/ssh-pool.sh -- "$(cat <<'EOF'
          set -euo pipefail
          cd /opt/sailing-plans
          docker compose up -d --no-deps --force-recreate --remove-orphans caddy
          docker compose rm -sf db 2>/dev/null || true
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Proxy health check failed"
          docker compose logs --tail=80 caddy
          exit 1
          EOF
          )"

  healthcheck-inactive:
    needs: [resolve-colors, scale-inactive, deploy-api, deploy-web, deploy-proxy]
    if: |
      always()
      && needs.scale-inactive.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      && (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped')
      && (needs.deploy-proxy.result == 'success' || needs.deploy-proxy.result == 'skipped')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Confirm inactive fleet healthy
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          INACTIVE_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
          MIN: ${{ needs.resolve-colors.outputs.baseline_min }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/wait-pool-hosts.sh "$INACTIVE_TAG" "$MIN" 300

  cutover:
    needs: [resolve-colors, healthcheck-inactive]
    if: |
      always()
      && needs.healthcheck-inactive.result == 'success'
      && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_cutover != 'true')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Flip LB to inactive color
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          LOADBALANCER_ID: ${{ env.LOADBALANCER_ID }}
          INACTIVE_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
          LB_HOST: ${{ secrets.LOADBALANCER_IP }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/lb-set-tag.sh "$INACTIVE_TAG"
          for i in $(seq 1 36); do
            if curl -fsS "http://${LB_HOST}/health" >/dev/null; then
              echo "LB healthy after cutover"
              exit 0
            fi
            sleep 5
          done
          echo "LB unhealthy after cutover — flip back manually if needed" >&2
          exit 1

      - name: Record active color for migrations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INACTIVE_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
        run: |
          # Best-effort: GITHUB_TOKEN often cannot write environment variables.
          # Migrate Development resolves the active tag from the LB when needed.
          gh variable set ACTIVE_COLOR_TAG --env development --body "$INACTIVE_TAG" || \
            echo "Could not update ACTIVE_COLOR_TAG (non-fatal); migrate will read LB tag."

  record-release:
    needs: [resolve-colors, healthcheck-inactive, build-api, build-web, cutover]
    if: |
      always()
      && needs.healthcheck-inactive.result == 'success'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Write release.json for rollback/forward
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          ACTIVE_TAG: ${{ needs.resolve-colors.outputs.active_tag }}
          INACTIVE_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
          API_IMAGE_BUILT: ${{ needs.build-api.outputs.image }}
          WEB_IMAGE_BUILT: ${{ needs.build-web.outputs.image }}
          GIT_SHA: ${{ github.sha }}
          CUTOVER_RESULT: ${{ needs.cutover.result }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh

          # Prefer built images; fall back to whatever is on the inactive hosts.
          export POOL_TAG="$INACTIVE_TAG"
          host_env="$(./deploy/scripts/ssh-pool.sh --first-only -- \
            'cd /opt/sailing-plans && grep -E "^(API_IMAGE|WEB_IMAGE)=" .env || true' || true)"
          api_image="${API_IMAGE_BUILT:-}"
          web_image="${WEB_IMAGE_BUILT:-}"
          if [[ -z "$api_image" ]]; then
            api_image="$(grep -E '^API_IMAGE=' <<<"$host_env" | head -n1 | cut -d= -f2- || true)"
          fi
          if [[ -z "$web_image" ]]; then
            web_image="$(grep -E '^WEB_IMAGE=' <<<"$host_env" | head -n1 | cut -d= -f2- || true)"
          fi

          export POOL_TAG="$ACTIVE_TAG"
          prev_state="$(./deploy/scripts/release-state.sh get || echo '{}')"
          pending="$(jq -nc \
            --arg api "$api_image" \
            --arg web "$web_image" \
            --arg sha "$GIT_SHA" \
            --arg color "$INACTIVE_TAG" \
            '{api_image:$api, web_image:$web, git_sha:$sha, color:$color, deployed_at:(now|todate)}')"

          if [[ "$CUTOVER_RESULT" == "success" ]]; then
            # Cut over: new active = inactive color; previous = former active release.
            new_state="$(jq -c --argjson pending "$pending" --arg active "$INACTIVE_TAG" --arg prev "$ACTIVE_TAG" '
              {
                active_color: $active,
                previous_color: $prev,
                active: $pending,
                previous: (.active // {}),
                pending: null,
                updated_at: (now | todate),
                last_action: "deploy-cutover"
              }
            ' <<<"$prev_state")"
            export POOL_TAG="$INACTIVE_TAG"
          else
            # skip_cutover (or cutover skipped): park build as pending for Release → forward.
            new_state="$(jq -c --argjson pending "$pending" --arg active "$ACTIVE_TAG" '
              .active_color = $active
              | .pending = $pending
              | .updated_at = (now | todate)
              | .last_action = "deploy-pending"
            ' <<<"$prev_state")"
            export POOL_TAG="$ACTIVE_TAG"
          fi

          tmp="$(mktemp)"
          echo "$new_state" | jq . | tee "$tmp"
          ./deploy/scripts/release-state.sh put "$tmp"
          # Also persist onto the inactive fleet so either color can serve state.
          export POOL_TAG="$INACTIVE_TAG"
          ./deploy/scripts/release-state.sh put "$tmp" || true
          rm -f "$tmp"

  finalize:
    needs: [resolve-colors, cutover, record-release]
    if: |
      always()
      && needs.cutover.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && github.event.inputs.finalize == 'true'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Delete previous color pool
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          POOL_ID: ${{ needs.resolve-colors.outputs.active_pool_id }}
          OLD_TAG: ${{ needs.resolve-colors.outputs.active_tag }}
          KEEP_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          # Optional: drops instant rollback. Prefer Release Development → teardown-idle.
          ./deploy/scripts/autoscale-delete.sh "$POOL_ID" "$OLD_TAG" "$KEEP_TAG"
