name: Ship (Development)

# Ships app images to development (blue/green under the hood).
# Fix-forward only — no runtime rollback. See docs/shipping.md
# Schema changes: Migrate runs first; it re-triggers Ship when app code is also present.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "deploy/docker-compose.yml"
      - "deploy/Caddyfile"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev-pool
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/sailing-plans
  APP_DIR: /opt/sailing-plans
  POOL_TAG: ${{ vars.POOL_TAG || 'sailing-plans-app-dev-pool' }}
  BLUE_TAG: ${{ vars.BLUE_TAG || 'sailing-plans-app-dev-pool-blue' }}
  GREEN_TAG: ${{ vars.GREEN_TAG || 'sailing-plans-app-dev-pool-green' }}
  BASELINE_MIN: ${{ vars.BASELINE_MIN || '2' }}
  LOADBALANCER_ID: ${{ vars.LOADBALANCER_ID }}
  AUTOSCALE_POOL_ID_BLUE: ${{ vars.AUTOSCALE_POOL_ID_BLUE }}
  AUTOSCALE_POOL_ID_GREEN: ${{ vars.AUTOSCALE_POOL_ID_GREEN }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.select.outputs.api }}
      web: ${{ steps.select.outputs.web }}
      proxy: ${{ steps.select.outputs.proxy }}
      defer_for_migrate: ${{ steps.select.outputs.defer_for_migrate }}
      proceed: ${{ steps.select.outputs.proceed }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect path changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '!apps/api/prisma/migrations/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
            proxy:
              - 'deploy/Caddyfile'
              - 'deploy/docker-compose.yml'
            migrations:
              - 'apps/api/prisma/migrations/**'

      - name: Resolve components
        id: select
        run: |
          defer=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual run always ships everything.
            api=true; web=true; proxy=true
          else
            api=${{ steps.filter.outputs.api || 'false' }}
            web=${{ steps.filter.outputs.web || 'false' }}
            proxy=${{ steps.filter.outputs.proxy || 'false' }}
            migrations=${{ steps.filter.outputs.migrations || 'false' }}
            # Avoid migrate↔ship race: Migrate owns the commit, then re-triggers Ship.
            if [[ "$migrations" == "true" ]]; then
              echo "This push includes DB migrations — deferring Ship to Migrate DB workflow."
              defer=true
              api=false; web=false; proxy=false
            fi
          fi
          proceed=false
          if [[ "$defer" != "true" && ( "$api" == "true" || "$web" == "true" || "$proxy" == "true" ) ]]; then
            proceed=true
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "proxy=$proxy" >> "$GITHUB_OUTPUT"
          echo "defer_for_migrate=$defer" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "Ship selection → api=$api web=$web proxy=$proxy defer=$defer proceed=$proceed"

  await-ci:
    needs: changes
    if: needs.changes.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          echo "Waiting for CI success on $sha"
          for i in $(seq 1 120); do
            json="$(gh run list --workflow=CI --commit "$sha" --limit 5 \
              --json databaseId,conclusion,status,event 2>/dev/null || echo '[]')"
            # Prefer a completed success; ignore cancelled supersedes while another runs.
            success="$(jq -r '[.[] | select(.conclusion=="success")] | length' <<<"$json")"
            if [[ "$success" -gt 0 ]]; then
              echo "CI succeeded"
              exit 0
            fi
            failed="$(jq -r '[.[] | select(.conclusion=="failure")] | length' <<<"$json")"
            running="$(jq -r '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending")] | length' <<<"$json")"
            if [[ "$failed" -gt 0 && "$running" -eq 0 ]]; then
              echo "CI failed for $sha" >&2
              jq -r '.[] | select(.conclusion=="failure") | "\(.databaseId) \(.conclusion)"' <<<"$json" >&2 || true
              exit 1
            fi
            if [[ "$running" -eq 0 && "$success" -eq 0 && "$failed" -eq 0 && "$i" -gt 6 ]]; then
              echo "No CI run found for $sha after waiting — failing closed" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for CI" >&2
          exit 1

  resolve-colors:
    needs: [changes, await-ci]
    if: needs.changes.outputs.proceed == 'true' && needs.await-ci.result == 'success'
    runs-on: ubuntu-latest
    environment: development
    outputs:
      active_tag: ${{ steps.colors.outputs.active_tag }}
      inactive_tag: ${{ steps.colors.outputs.inactive_tag }}
      inactive_pool_id: ${{ steps.colors.outputs.inactive_pool_id }}
      active_pool_id: ${{ steps.colors.outputs.active_pool_id }}
      inactive_pool_name: ${{ steps.colors.outputs.inactive_pool_name }}
      baseline_min: ${{ steps.colors.outputs.baseline_min }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve active / inactive colors
        id: colors
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          LOADBALANCER_ID: ${{ env.LOADBALANCER_ID }}
          POOL_TAG: ${{ env.POOL_TAG }}
          BLUE_TAG: ${{ env.BLUE_TAG }}
          GREEN_TAG: ${{ env.GREEN_TAG }}
          AUTOSCALE_POOL_ID_BLUE: ${{ env.AUTOSCALE_POOL_ID_BLUE }}
          AUTOSCALE_POOL_ID_GREEN: ${{ env.AUTOSCALE_POOL_ID_GREEN }}
          BASELINE_MIN: ${{ env.BASELINE_MIN }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          if [[ -z "${LOADBALANCER_ID}" ]]; then
            echo "LOADBALANCER_ID must be set" >&2
            exit 1
          fi
          ./deploy/scripts/resolve-colors.sh | tee /tmp/colors.env
          # shellcheck disable=SC1091
          set -a; source /tmp/colors.env; set +a
          echo "active_tag=$active_tag" >> "$GITHUB_OUTPUT"
          echo "inactive_tag=$inactive_tag" >> "$GITHUB_OUTPUT"
          echo "inactive_pool_id=$inactive_pool_id" >> "$GITHUB_OUTPUT"
          echo "active_pool_id=$active_pool_id" >> "$GITHUB_OUTPUT"
          echo "inactive_pool_name=$inactive_pool_name" >> "$GITHUB_OUTPUT"
          echo "baseline_min=$baseline_min" >> "$GITHUB_OUTPUT"
          echo "Active=$active_tag Inactive=$inactive_tag"

  build-api:
    needs: [changes, await-ci]
    if: |
      always()
      && needs.changes.outputs.proceed == 'true'
      && needs.await-ci.result == 'success'
      && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha_tag="${GITHUB_SHA::12}"
          echo "image=${IMAGE_PREFIX}-api:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_PREFIX}-api:dev" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

  build-web:
    needs: [changes, await-ci]
    if: |
      always()
      && needs.changes.outputs.proceed == 'true'
      && needs.await-ci.result == 'success'
      && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha_tag="${GITHUB_SHA::12}"
          echo "image=${IMAGE_PREFIX}-web:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_PREFIX}-web:dev" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=web-dev
          cache-to: type=gha,mode=max,scope=web-dev

  scale-inactive:
    needs: [changes, resolve-colors, build-api, build-web]
    if: |
      always()
      && needs.changes.outputs.proceed == 'true'
      && needs.resolve-colors.result == 'success'
      && (needs.changes.outputs.api != 'true' || needs.build-api.result == 'success')
      && (needs.changes.outputs.web != 'true' || needs.build-web.result == 'success')
    runs-on: ubuntu-latest
    environment: development
    outputs:
      inactive_pool_id: ${{ steps.ensure.outputs.inactive_pool_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Ensure inactive pool + scale to baseline
        id: ensure
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          POOL_ID: ${{ needs.resolve-colors.outputs.inactive_pool_id }}
          POOL_NAME: ${{ needs.resolve-colors.outputs.inactive_pool_name }}
          COLOR_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
          SHARED_TAG: ${{ env.POOL_TAG }}
          CLONE_FROM: ${{ needs.resolve-colors.outputs.active_pool_id }}
          MIN: ${{ needs.resolve-colors.outputs.baseline_min }}
          INACTIVE_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          out="$(./deploy/scripts/autoscale-ensure.sh \
            "$POOL_ID" "$POOL_NAME" "$COLOR_TAG" "$SHARED_TAG" "$CLONE_FROM" "$MIN")"
          echo "$out"
          new_id="$(sed -n 's/^pool_id=//p' <<<"$out" | tail -n1)"
          echo "inactive_pool_id=$new_id" >> "$GITHUB_OUTPUT"
          ./deploy/scripts/wait-pool-hosts.sh "$INACTIVE_TAG" "$MIN" 900

  deploy-api:
    needs: [changes, resolve-colors, scale-inactive, build-api]
    if: |
      always()
      && needs.changes.outputs.api == 'true'
      && needs.build-api.result == 'success'
      && needs.scale-inactive.result == 'success'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy API to inactive color
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          API_IMAGE: ${{ needs.build-api.outputs.image }}
          POOL_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/ssh-pool.sh -- "$(cat <<EOF
          set -euo pipefail
          cd /opt/sailing-plans
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          grep -vE '^API_IMAGE=' .env > .env.tmp || true
          { cat .env.tmp; echo "API_IMAGE=${API_IMAGE}"; } > .env
          rm -f .env.tmp
          chmod 600 .env
          docker compose pull api
          docker compose up -d --no-deps --remove-orphans api
          for i in \$(seq 1 45); do
            if curl -fsS http://127.0.0.1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API health check failed"
          docker compose logs --tail=80 api
          exit 1
          EOF
          )"

  deploy-web:
    needs: [changes, resolve-colors, scale-inactive, build-web, deploy-api, build-api]
    if: |
      always()
      && needs.changes.outputs.web == 'true'
      && needs.build-web.result == 'success'
      && needs.scale-inactive.result == 'success'
      && (needs.changes.outputs.api != 'true' || needs.deploy-api.result == 'success')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy Web to inactive color
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          WEB_IMAGE: ${{ needs.build-web.outputs.image }}
          POOL_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/ssh-pool.sh -- "$(cat <<EOF
          set -euo pipefail
          cd /opt/sailing-plans
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          grep -vE '^WEB_IMAGE=' .env > .env.tmp || true
          { cat .env.tmp; echo "WEB_IMAGE=${WEB_IMAGE}"; } > .env
          rm -f .env.tmp
          chmod 600 .env
          docker compose pull web
          docker compose up -d --no-deps --remove-orphans web
          for i in \$(seq 1 45); do
            code="\$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/ || true)"
            if [[ "\$code" == "200" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "Web health check failed"
          docker compose logs --tail=80 web
          exit 1
          EOF
          )"

  deploy-proxy:
    needs: [changes, resolve-colors, scale-inactive, deploy-api, deploy-web]
    if: |
      always()
      && needs.changes.outputs.proxy == 'true'
      && needs.scale-inactive.result == 'success'
      && (needs.changes.outputs.api != 'true' || needs.deploy-api.result == 'success')
      && (needs.changes.outputs.web != 'true' || needs.deploy-web.result == 'success')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync compose + Caddyfile to inactive color
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          POOL_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          KEY_PATH="$(mktemp)"
          printf '%s\n' "$DROPLET_SSH_KEY" >"$KEY_PATH"
          chmod 600 "$KEY_PATH"
          mapfile -t HOSTS < <(./deploy/scripts/pool-hosts.sh)
          if [[ "${#HOSTS[@]}" -eq 0 ]]; then
            echo "No pool hosts for tag $POOL_TAG" >&2
            exit 1
          fi
          for host in "${HOSTS[@]}"; do
            echo "Syncing to $host"
            scp -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes \
              -i "$KEY_PATH" \
              deploy/docker-compose.yml deploy/Caddyfile \
              "${DROPLET_USER}@${host}:/opt/sailing-plans/"
          done
          rm -f "$KEY_PATH"

          ./deploy/scripts/ssh-pool.sh -- "$(cat <<'EOF'
          set -euo pipefail
          cd /opt/sailing-plans
          docker compose up -d --no-deps --force-recreate --remove-orphans caddy
          docker compose rm -sf db 2>/dev/null || true
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Proxy health check failed"
          docker compose logs --tail=80 caddy
          exit 1
          EOF
          )"

  healthcheck-inactive:
    needs: [changes, resolve-colors, scale-inactive, deploy-api, deploy-web, deploy-proxy]
    if: |
      always()
      && needs.scale-inactive.result == 'success'
      && (needs.changes.outputs.api != 'true' || needs.deploy-api.result == 'success')
      && (needs.changes.outputs.web != 'true' || needs.deploy-web.result == 'success')
      && (needs.changes.outputs.proxy != 'true' || needs.deploy-proxy.result == 'success')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Confirm inactive fleet healthy
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          INACTIVE_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
          MIN: ${{ needs.resolve-colors.outputs.baseline_min }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/wait-pool-hosts.sh "$INACTIVE_TAG" "$MIN" 300

  cutover:
    needs: [resolve-colors, healthcheck-inactive]
    if: |
      always()
      && needs.healthcheck-inactive.result == 'success'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Flip LB to inactive color
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          LOADBALANCER_ID: ${{ env.LOADBALANCER_ID }}
          INACTIVE_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
          PREV_TAG: ${{ needs.resolve-colors.outputs.active_tag }}
          LB_HOST: ${{ secrets.LOADBALANCER_IP }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/lb-set-tag.sh "$INACTIVE_TAG"
          for i in $(seq 1 36); do
            if curl -fsS "http://${LB_HOST}/health" >/dev/null; then
              echo "LB healthy after cutover"
              exit 0
            fi
            sleep 5
          done
          echo "LB unhealthy after cutover — flipping back to $PREV_TAG" >&2
          ./deploy/scripts/lb-set-tag.sh "$PREV_TAG" || true
          for i in $(seq 1 24); do
            if curl -fsS "http://${LB_HOST}/health" >/dev/null; then
              echo "LB restored on $PREV_TAG" >&2
              break
            fi
            sleep 5
          done
          exit 1

  record-release:
    needs: [resolve-colors, healthcheck-inactive, build-api, build-web, cutover]
    if: |
      always()
      && needs.healthcheck-inactive.result == 'success'
      && needs.cutover.result == 'success'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Register release in ledger + host state
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          RELEASE_LEDGER_URI: s3://sailing-plans-tfstate/releases/dev/ledger.json
          ACTIVE_TAG: ${{ needs.resolve-colors.outputs.active_tag }}
          INACTIVE_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
          API_IMAGE_BUILT: ${{ needs.build-api.outputs.image }}
          WEB_IMAGE_BUILT: ${{ needs.build-web.outputs.image }}
          GIT_SHA: ${{ github.sha }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          aws --version

          export POOL_TAG="$INACTIVE_TAG"
          host_env="$(./deploy/scripts/ssh-pool.sh --first-only -- \
            'cd /opt/sailing-plans && grep -E "^(API_IMAGE|WEB_IMAGE)=" .env || true' || true)"
          api_image="${API_IMAGE_BUILT:-}"
          web_image="${WEB_IMAGE_BUILT:-}"
          if [[ -z "$api_image" ]]; then
            api_image="$(grep -E '^API_IMAGE=' <<<"$host_env" | head -n1 | cut -d= -f2- || true)"
          fi
          if [[ -z "$web_image" ]]; then
            web_image="$(grep -E '^WEB_IMAGE=' <<<"$host_env" | head -n1 | cut -d= -f2- || true)"
          fi
          if [[ -z "$api_image" || -z "$web_image" ]]; then
            echo "Cannot register release without API_IMAGE and WEB_IMAGE" >&2
            exit 1
          fi

          short="${GIT_SHA::12}"
          rid="$(date -u +%Y%m%dT%H%M%SZ)-${short}"
          msg="$(printf '%s' "${RELEASE_MESSAGE:-}" | head -n1)"

          release="$(jq -nc \
            --arg id "$rid" \
            --arg sha "$GIT_SHA" \
            --arg short "$short" \
            --arg api "$api_image" \
            --arg web "$web_image" \
            --arg msg "$msg" \
            '{
              id: $id,
              git_sha: $sha,
              git_sha_short: $short,
              api_image: $api,
              web_image: $web,
              message: $msg,
              live: true,
              created_at: (now|todate),
              source: "deploy"
            }')"
          echo "$release" | jq .
          ./deploy/scripts/release-ledger.sh append "$release"
          ./deploy/scripts/release-ledger.sh set-current "$rid"

          host_state="$(jq -nc \
            --argjson rel "$release" \
            --arg active "$INACTIVE_TAG" \
            --arg prev "$ACTIVE_TAG" \
            '{
              active_color: $active,
              previous_color: $prev,
              active: $rel,
              pending: null,
              updated_at: (now|todate),
              last_action: "deploy-cutover"
            }')"
          tmp="$(mktemp)"
          echo "$host_state" | jq . | tee "$tmp"
          export POOL_TAG="$INACTIVE_TAG"
          ./deploy/scripts/release-state.sh put "$tmp"
          rm -f "$tmp"
          echo "Registered release $rid"

  teardown-previous:
    needs: [resolve-colors, cutover, record-release]
    if: |
      always()
      && needs.cutover.result == 'success'
      && needs.record-release.result == 'success'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Delete previous color pool
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          POOL_ID: ${{ needs.resolve-colors.outputs.active_pool_id }}
          OLD_TAG: ${{ needs.resolve-colors.outputs.active_tag }}
          KEEP_TAG: ${{ needs.resolve-colors.outputs.inactive_tag }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          if [[ -z "${POOL_ID:-}" ]]; then
            echo "No previous pool id — nothing to tear down"
            exit 0
          fi
          ./deploy/scripts/autoscale-delete.sh "$POOL_ID" "$OLD_TAG" "$KEEP_TAG"
