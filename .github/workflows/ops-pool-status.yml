name: Ops Pool Status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: List autoscale pools + tagged droplets
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          BLUE_ID: ${{ vars.AUTOSCALE_POOL_ID_BLUE }}
          GREEN_ID: ${{ vars.AUTOSCALE_POOL_ID_GREEN }}
          POOL_TAG: ${{ vars.POOL_TAG || 'sailing-plans-app-dev-pool' }}
          BLUE_TAG: ${{ vars.BLUE_TAG || 'sailing-plans-app-dev-pool-blue' }}
          GREEN_TAG: ${{ vars.GREEN_TAG || 'sailing-plans-app-dev-pool-green' }}
        run: |
          set -euo pipefail
          echo "=== Autoscale pools (name match) ==="
          curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
            "https://api.digitalocean.com/v2/droplets/autoscale?per_page=200" \
            | jq -r '.autoscale_pools[]? | select(.name|test("sailing-plans")) | "\(.id) \(.name) min=\(.config.min_instances) max=\(.config.max_instances) active=\(.active_resources_count) status=\(.status)"'

          echo "=== Pool by stored IDs ==="
          for id in "$BLUE_ID" "$GREEN_ID"; do
            code=$(curl -sS -o /tmp/p.json -w '%{http_code}' -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/droplets/autoscale/$id" || true)
            echo "id=$id http=$code"
            if [[ "$code" == "200" ]]; then
              jq -r '.autoscale_pool | "\(.name) min=\(.config.min_instances) active=\(.active_resources_count)"' /tmp/p.json
            fi
          done

          echo "=== Droplets by tag ==="
          for tag in "$POOL_TAG" "$BLUE_TAG" "$GREEN_TAG"; do
            echo "-- tag=$tag"
            curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/droplets?tag_name=${tag}&per_page=200" \
              | jq -r '.droplets[]? | "\(.id) \(.name) status=\(.status) tags=\(.tags|join(","))"'
          done

          echo "=== All sailing-plans droplets (name filter) ==="
          curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
            "https://api.digitalocean.com/v2/droplets?per_page=200" \
            | jq -r '.droplets[]? | select(.name|test("sailing-plans")) | "\(.id) \(.name) status=\(.status) tags=\(.tags|join(","))"'
