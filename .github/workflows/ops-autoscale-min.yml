name: Ops Autoscale Min

on:
  workflow_dispatch:
    inputs:
      pool:
        description: Which pool to scale or delete
        required: true
        type: choice
        options:
          - blue
          - green
      action:
        description: Scale min_instances, or delete the whole pool
        required: true
        type: choice
        default: set-min
        options:
          - set-min
          - delete
      min:
        description: min_instances when action=set-min (DO requires >= 1)
        required: true
        type: string
        default: "1"

concurrency:
  group: ops-autoscale-min
  cancel-in-progress: false

jobs:
  set-min:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Apply pool action
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          POOL: ${{ github.event.inputs.pool }}
          ACTION: ${{ github.event.inputs.action }}
          MIN: ${{ github.event.inputs.min }}
          AUTOSCALE_POOL_ID_BLUE: ${{ vars.AUTOSCALE_POOL_ID_BLUE }}
          AUTOSCALE_POOL_ID_GREEN: ${{ vars.AUTOSCALE_POOL_ID_GREEN }}
          ACTIVE_COLOR_TAG: ${{ vars.ACTIVE_COLOR_TAG }}
          BLUE_TAG: ${{ vars.BLUE_TAG || 'sailing-plans-app-dev-pool-blue' }}
          GREEN_TAG: ${{ vars.GREEN_TAG || 'sailing-plans-app-dev-pool-green' }}
          LOADBALANCER_ID: ${{ vars.LOADBALANCER_ID }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          if [[ "$POOL" == "blue" ]]; then
            POOL_ID="$AUTOSCALE_POOL_ID_BLUE"
            TAG="$BLUE_TAG"
            POOL_NAME="sailing-plans-app-dev"
          else
            POOL_ID="$AUTOSCALE_POOL_ID_GREEN"
            TAG="$GREEN_TAG"
            POOL_NAME="sailing-plans-app-dev-green"
          fi
          # Prefer live lookup by name — IDs go stale after delete/recreate.
          found="$(curl -fsS -H "Authorization: Bearer ${DIGITALOCEAN_TOKEN}" \
            "https://api.digitalocean.com/v2/droplets/autoscale?per_page=200" \
            | jq -r --arg n "$POOL_NAME" '.autoscale_pools[]? | select(.name==$n) | .id' | head -n1)"
          if [[ -n "$found" ]]; then
            POOL_ID="$found"
          fi
          if [[ "$ACTION" == "delete" ]]; then
            keep="$ACTIVE_COLOR_TAG"
            if [[ -n "${LOADBALANCER_ID}" ]]; then
              keep="$(curl -fsS -H "Authorization: Bearer ${DIGITALOCEAN_TOKEN}" \
                "https://api.digitalocean.com/v2/load_balancers/${LOADBALANCER_ID}" \
                | jq -r '.load_balancer.tag // .load_balancer.droplet_tag // empty')"
            fi
            if [[ "$keep" == "$TAG" ]]; then
              echo "Refusing to delete the active color ($TAG)" >&2
              exit 1
            fi
            if [[ -z "$POOL_ID" ]]; then
              echo "No pool named $POOL_NAME found; scrubbing leftovers only"
              ./deploy/scripts/autoscale-delete.sh "00000000-0000-0000-0000-000000000000" "$TAG" "$keep" || true
              # Direct leftover scrub when pool id unknown
              mapfile -t ROWS < <(curl -fsS -H "Authorization: Bearer ${DIGITALOCEAN_TOKEN}" \
                "https://api.digitalocean.com/v2/droplets?tag_name=${TAG}&per_page=200" \
                | jq -r --arg keep "$keep" '.droplets[]? | select(((.tags//[])|index($keep)|not)) | .id')
              for id in "${ROWS[@]:-}"; do
                [[ -n "$id" ]] || continue
                curl -fsS -X DELETE -H "Authorization: Bearer ${DIGITALOCEAN_TOKEN}" \
                  "https://api.digitalocean.com/v2/droplets/${id}" >/dev/null || true
                echo "destroyed $id"
              done
              exit 0
            fi
            ./deploy/scripts/autoscale-delete.sh "$POOL_ID" "$TAG" "$keep"
          else
            ./deploy/scripts/autoscale-set-min.sh "$POOL_ID" "$MIN"
          fi
