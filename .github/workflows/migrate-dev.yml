name: Migrate DB (Development)

# Applies Prisma migrations. Runs before Ship when schema changes.
# Developers: docs/shipping.md — leave api_image empty unless you know you need it.
on:
  workflow_dispatch:
    inputs:
      api_image:
        description: "Leave empty (builds this commit). ⚠ Advanced: pin a specific API image"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/api/prisma/migrations/**"
      - ".github/workflows/migrate-dev.yml"

concurrency:
  # Serialize with ship/ops so migrate always wins the DB before cutover.
  group: deploy-dev-pool
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/sailing-plans

jobs:
  build-api:
    if: github.event_name == 'push' || github.event.inputs.api_image == '' || github.event.inputs.api_image == null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha_tag="${GITHUB_SHA::12}"
          echo "image=${IMAGE_PREFIX}-api:${sha_tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

  migrate:
    needs: [build-api]
    if: always() && (needs.build-api.result == 'success' || needs.build-api.result == 'skipped')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run prisma migrate deploy on one pool host
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          API_IMAGE: ${{ github.event.inputs.api_image || needs.build-api.outputs.image }}
          LOADBALANCER_ID: ${{ vars.LOADBALANCER_ID }}
          BLUE_TAG: ${{ vars.BLUE_TAG || 'sailing-plans-app-dev-pool-blue' }}
          GREEN_TAG: ${{ vars.GREEN_TAG || 'sailing-plans-app-dev-pool-green' }}
          POOL_TAG_FALLBACK: ${{ vars.ACTIVE_COLOR_TAG || vars.POOL_TAG || 'sailing-plans-app-dev-pool' }}
        run: |
          set -euo pipefail
          if [[ -z "${API_IMAGE}" ]]; then
            echo "API_IMAGE is empty" >&2
            exit 1
          fi
          chmod +x deploy/scripts/*.sh
          if [[ -n "${LOADBALANCER_ID}" ]]; then
            active="$(./deploy/scripts/lb-get-tag.sh || true)"
            if [[ "$active" == "$BLUE_TAG" || "$active" == "$GREEN_TAG" ]]; then
              export POOL_TAG="$active"
            else
              export POOL_TAG="$POOL_TAG_FALLBACK"
            fi
          else
            export POOL_TAG="$POOL_TAG_FALLBACK"
          fi
          echo "Migrating via pool tag: $POOL_TAG"
          ./deploy/scripts/ssh-pool.sh --first-only -- "$(cat <<EOF
          set -euo pipefail
          cd /opt/sailing-plans
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${API_IMAGE}"
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          if [[ -z "\${DATABASE_URL:-}" ]]; then
            echo "DATABASE_URL missing on host .env" >&2
            exit 1
          fi
          docker run --rm \
            -e DATABASE_URL \
            -e NODE_ENV=production \
            "${API_IMAGE}" \
            npx prisma migrate deploy
          EOF
          )"

  trigger-ship:
    needs: [migrate]
    if: github.event_name == 'push' && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trigger Ship when this commit also has app changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          else
            mapfile -t files < <(git diff --name-only "$before" "$GITHUB_SHA")
          fi
          app=false
          for f in "${files[@]}"; do
            case "$f" in
              apps/api/prisma/migrations/*) ;;
              apps/api/*|apps/web/*|packages/*|deploy/docker-compose.yml|deploy/Caddyfile|pnpm-lock.yaml)
                app=true
                ;;
            esac
          done
          if [[ "$app" != "true" ]]; then
            echo "Migrate-only commit — not triggering Ship"
            exit 0
          fi
          echo "App changes present — triggering Ship (Development)"
          gh workflow run "Ship (Development)" --ref "$GITHUB_REF_NAME" \
            -f component=all \
            -f release_message="auto after migrate ${GITHUB_SHA::12}"
