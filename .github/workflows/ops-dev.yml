name: Ops (Development)

# Platform / on-call. Developers: ignore. See docs/deploy-ops.md
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        default: status
        options:
          - status
          - releases
          - teardown-idle
          - set-lb-tag

      tag:
        description: "set-lb-tag only: full color tag from status"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-dev-pool
  cancel-in-progress: false

env:
  SHARED_POOL_TAG: ${{ vars.POOL_TAG || 'sailing-plans-app-dev-pool' }}
  BLUE_TAG: ${{ vars.BLUE_TAG || 'sailing-plans-app-dev-pool-blue' }}
  GREEN_TAG: ${{ vars.GREEN_TAG || 'sailing-plans-app-dev-pool-green' }}
  LOADBALANCER_ID: ${{ vars.LOADBALANCER_ID }}
  AUTOSCALE_POOL_ID_BLUE: ${{ vars.AUTOSCALE_POOL_ID_BLUE }}
  AUTOSCALE_POOL_ID_GREEN: ${{ vars.AUTOSCALE_POOL_ID_GREEN }}
  RELEASE_LEDGER_URI: s3://sailing-plans-tfstate/releases/dev/ledger.json
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          aws --version

      - name: Run ops action
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          LB_HOST: ${{ secrets.LOADBALANCER_IP }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          ACTION: ${{ github.event.inputs.action }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh

          load_colors() {
            ./deploy/scripts/resolve-colors.sh > /tmp/colors.env
            # shellcheck disable=SC1091
            set -a; source /tmp/colors.env; set +a
          }

          case "$ACTION" in
            status)
              load_colors
              echo "Active=$active_tag Idle=$inactive_tag"
              echo "active_pool=$active_pool_id idle_pool=${inactive_pool_id:-none}"
              echo
              echo "=== Autoscale pools ==="
              curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
                "https://api.digitalocean.com/v2/droplets/autoscale?per_page=200" \
                | jq -r '.autoscale_pools[]? | select(.name|test("sailing-plans")) | "\(.id) \(.name) min=\(.config.min_instances) active=\(.active_resources_count) status=\(.status)"'
              echo
              echo "=== Droplets ==="
              curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
                "https://api.digitalocean.com/v2/droplets?per_page=200" \
                | jq -r '.droplets[]? | select(.name|test("sailing-plans")) | "\(.id) \(.name) status=\(.status) tags=\(.tags|join(","))"'
              echo
              echo "=== Current release ==="
              ./deploy/scripts/release-ledger.sh current || echo "{}"
              ;;

            releases)
              echo "=== Release ledger (* = current) ==="
              ./deploy/scripts/release-ledger.sh list
              ;;

            teardown-idle)
              load_colors
              [[ -n "${inactive_pool_id:-}" ]] || { echo "No idle pool to tear down"; exit 0; }
              ./deploy/scripts/autoscale-delete.sh "$inactive_pool_id" "$inactive_tag" "$active_tag"
              ;;

            set-lb-tag)
              tag="${TAG_INPUT:-}"
              if [[ -z "$tag" ]]; then
                echo "tag input required (run status first for the full color tag)" >&2
                exit 2
              fi
              ./deploy/scripts/lb-set-tag.sh "$tag"
              for i in $(seq 1 36); do
                code="$(curl -sS -o /dev/null -w '%{http_code}' "http://${LB_HOST}/health" || true)"
                echo "health http=$code"
                [[ "$code" == "200" ]] && exit 0
                sleep 5
              done
              echo "LB still unhealthy" >&2
              exit 1
              ;;

            *)
              echo "Unknown action: $ACTION" >&2
              exit 2
              ;;
          esac
