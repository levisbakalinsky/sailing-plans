name: Release Development

# Roll back / forward between blue-green colors, or tear down the idle color.
# Instant flip when the other color still has healthy hosts; otherwise rebuild
# from release.json image pins (rollback only).
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        default: rollback
        options:
          - rollback
          - forward
          - status
          - teardown-idle
      finalize:
        description: After rollback/forward, delete the newly-idle color
        type: boolean
        default: false

concurrency:
  group: deploy-dev-pool
  cancel-in-progress: false

env:
  SHARED_POOL_TAG: ${{ vars.POOL_TAG || 'sailing-plans-app-dev-pool' }}
  BLUE_TAG: ${{ vars.BLUE_TAG || 'sailing-plans-app-dev-pool-blue' }}
  GREEN_TAG: ${{ vars.GREEN_TAG || 'sailing-plans-app-dev-pool-green' }}
  BASELINE_MIN: ${{ vars.BASELINE_MIN || '2' }}
  LOADBALANCER_ID: ${{ vars.LOADBALANCER_ID }}
  AUTOSCALE_POOL_ID_BLUE: ${{ vars.AUTOSCALE_POOL_ID_BLUE }}
  AUTOSCALE_POOL_ID_GREEN: ${{ vars.AUTOSCALE_POOL_ID_GREEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/scripts
          sparse-checkout-cone-mode: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Release control
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          LB_HOST: ${{ secrets.LOADBALANCER_IP }}
          ACTION: ${{ github.event.inputs.action }}
          FINALIZE: ${{ github.event.inputs.finalize }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh

          active="$(./deploy/scripts/lb-get-tag.sh)"
          if [[ "$active" == "$SHARED_POOL_TAG" || -z "$active" ]]; then
            active="$BLUE_TAG"
          fi
          if [[ "$active" == "$BLUE_TAG" ]]; then
            inactive="$GREEN_TAG"
            active_pool="$AUTOSCALE_POOL_ID_BLUE"
            inactive_pool="$AUTOSCALE_POOL_ID_GREEN"
            inactive_name="sailing-plans-app-dev-green"
            active_name="sailing-plans-app-dev"
          elif [[ "$active" == "$GREEN_TAG" ]]; then
            inactive="$BLUE_TAG"
            active_pool="$AUTOSCALE_POOL_ID_GREEN"
            inactive_pool="$AUTOSCALE_POOL_ID_BLUE"
            inactive_name="sailing-plans-app-dev"
            active_name="sailing-plans-app-dev-green"
          else
            echo "Unexpected LB tag: $active" >&2
            exit 1
          fi
          echo "LB active=$active inactive=$inactive"

          export POOL_TAG="$active"
          state="$(./deploy/scripts/release-state.sh get || echo '{}')"
          echo "Current release state:"
          echo "$state" | jq .

          if [[ "$ACTION" == "status" ]]; then
            echo "=== inactive color hosts ==="
            POOL_TAG="$inactive" ./deploy/scripts/pool-hosts.sh || true
            exit 0
          fi

          resolve_pool_id() {
            local name="$1" fallback="$2"
            local found
            found="$(curl -fsS -H "Authorization: Bearer ${DIGITALOCEAN_TOKEN}" \
              "https://api.digitalocean.com/v2/droplets/autoscale?per_page=200" \
              | jq -r --arg n "$name" '.autoscale_pools[]? | select(.name==$n) | .id' | head -n1)"
            echo "${found:-$fallback}"
          }

          if [[ "$ACTION" == "teardown-idle" ]]; then
            pool_id="$(resolve_pool_id "$inactive_name" "$inactive_pool")"
            ./deploy/scripts/autoscale-delete.sh "$pool_id" "$inactive" "$active"
            echo "Idle color torn down."
            exit 0
          fi

          target="$inactive"
          target_pool="$inactive_pool"
          target_name="$inactive_name"
          clone_from="$(resolve_pool_id "$active_name" "$active_pool")"

          healthy_target=false
          if POOL_TAG="$target" ./deploy/scripts/wait-pool-hosts.sh "$target" 1 30; then
            healthy_target=true
          fi

          if [[ "$healthy_target" != "true" ]]; then
            if [[ "$ACTION" == "forward" ]]; then
              echo "No healthy idle color to forward to." >&2
              echo "Deploy with skip_cutover=true first, or run a normal deploy." >&2
              exit 1
            fi

            echo "Target color $target has no healthy hosts — rebuilding previous release"
            prev_api="$(jq -r '.previous.api_image // empty' <<<"$state")"
            prev_web="$(jq -r '.previous.web_image // empty' <<<"$state")"
            if [[ -z "$prev_api" || -z "$prev_web" ]]; then
              echo "release.json missing previous.api_image/web_image; cannot rebuild." >&2
              echo "Keep finalize=false on deploys so the other color stays available for instant rollback." >&2
              exit 1
            fi

            out="$(./deploy/scripts/autoscale-ensure.sh \
              "$target_pool" "$target_name" "$target" "$SHARED_POOL_TAG" "$clone_from" "$BASELINE_MIN")"
            echo "$out"
            new_id="$(sed -n 's/^pool_id=//p' <<<"$out" | tail -n1)"
            if [[ "$target" == "$GREEN_TAG" ]]; then
              gh variable set AUTOSCALE_POOL_ID_GREEN --env development --body "$new_id" || true
            else
              gh variable set AUTOSCALE_POOL_ID_BLUE --env development --body "$new_id" || true
            fi

            export POOL_TAG="$target"
            ./deploy/scripts/ssh-pool.sh -- "$(cat <<EOF
          set -euo pipefail
          cd /opt/sailing-plans
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          grep -vE '^(API_IMAGE|WEB_IMAGE)=' .env > .env.tmp || true
          { cat .env.tmp; echo "API_IMAGE=${prev_api}"; echo "WEB_IMAGE=${prev_web}"; } > .env
          rm -f .env.tmp
          chmod 600 .env
          docker compose pull api web
          docker compose up -d --remove-orphans
          for i in \$(seq 1 60); do
            if curl -fsS http://127.0.0.1/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs --tail=80
          exit 1
          EOF
            )"
            ./deploy/scripts/wait-pool-hosts.sh "$target" "$BASELINE_MIN" 600
          fi

          echo "Flipping LB -> $target ($ACTION)"
          ./deploy/scripts/lb-set-tag.sh "$target"
          for i in $(seq 1 36); do
            if curl -fsS "http://${LB_HOST}/health" >/dev/null; then
              echo "LB healthy"
              break
            fi
            sleep 5
            if [[ "$i" -eq 36 ]]; then
              echo "LB unhealthy after flip" >&2
              exit 1
            fi
          done

          export POOL_TAG="$target"
          if [[ "$ACTION" == "rollback" ]]; then
            new_state="$(jq -c --arg active "$target" --arg prev "$active" '
              {
                active_color: $active,
                previous_color: $prev,
                active: (.previous // .active // {}),
                previous: (.active // {}),
                pending: null,
                updated_at: (now | todate),
                last_action: "rollback"
              }
            ' <<<"$state")"
          else
            new_state="$(jq -c --arg active "$target" --arg prev "$active" '
              {
                active_color: $active,
                previous_color: $prev,
                active: (.pending // .active // {}),
                previous: (.active // {}),
                pending: null,
                updated_at: (now | todate),
                last_action: "forward"
              }
            ' <<<"$state")"
          fi
          tmp="$(mktemp)"
          echo "$new_state" | jq . | tee "$tmp"
          ./deploy/scripts/release-state.sh put "$tmp"
          rm -f "$tmp"
          gh variable set ACTIVE_COLOR_TAG --env development --body "$target" || true

          if [[ "$FINALIZE" == "true" ]]; then
            echo "Deleting newly idle color $active"
            idle_id="$(resolve_pool_id "$active_name" "$active_pool")"
            ./deploy/scripts/autoscale-delete.sh "$idle_id" "$active" "$target"
          else
            echo "Idle color $active kept for another rollback/forward."
            echo "Use action=teardown-idle (or finalize=true) to drop back to ~2 droplets."
          fi
