name: Terraform Development

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-dev.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-dev.yml"
  workflow_dispatch:

concurrency:
  group: terraform-dev
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/terraform/environments/dev

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # Plan/apply require shared remote state (DO Spaces). Enable after
  # configuring backend.hcl — see infra/terraform/README.md.
  plan:
    if: ${{ vars.TF_REMOTE_STATE_ENABLED == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: terraform init
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          terraform init -backend-config=backend.hcl
      - name: terraform plan
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: terraform plan -input=false -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infra/terraform/environments/dev/tfplan
          retention-days: 14
