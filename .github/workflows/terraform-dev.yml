name: Terraform Development

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "deploy/docker-compose.yml"
      - "deploy/Caddyfile"
      - ".github/workflows/terraform-dev.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - "deploy/docker-compose.yml"
      - "deploy/Caddyfile"
      - ".github/workflows/terraform-dev.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan after validate (creates/updates DO resources)"
        type: boolean
        default: false
      wire_pool_database_url:
        description: "After apply, write private DATABASE_URL + REDIS_URL into every pool Droplet .env and restart api"
        type: boolean
        default: false

concurrency:
  group: terraform-dev
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/terraform/environments/dev

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  plan:
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: terraform init
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: terraform init -backend-config=backend.hcl -input=false

      # Mutates remote state; skip on PRs so forks/reviews don't rewrite production state.
      - name: Migrate state for blue/green (idempotent)
        if: github.event_name != 'pull_request'
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: bash "${GITHUB_WORKSPACE}/deploy/scripts/tf-state-bluegreen.sh"

      - name: terraform plan
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          TF_VAR_ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > "$GITHUB_WORKSPACE/tfplan.txt"

      - uses: actions/upload-artifact@v5
        with:
          name: tfplan-dev
          path: |
            infra/terraform/environments/dev/tfplan
            tfplan.txt
          retention-days: 14

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    needs: plan
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: terraform init
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Migrate state for blue/green (idempotent)
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: bash "${GITHUB_WORKSPACE}/deploy/scripts/tf-state-bluegreen.sh"

      - name: terraform apply
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          TF_VAR_ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
        run: terraform apply -input=false -auto-approve

      - name: Print pool endpoints
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          echo "loadbalancer_ip=$(terraform output -raw loadbalancer_ip)"
          echo "loadbalancer_id=$(terraform output -raw loadbalancer_id)"
          echo "pool_tag=$(terraform output -raw pool_tag)"
          echo "blue_tag=$(terraform output -raw blue_tag)"
          echo "green_tag=$(terraform output -raw green_tag)"
          echo "autoscale_pool_id_blue=$(terraform output -raw autoscale_pool_id_blue)"
          echo "autoscale_pool_id_green=$(terraform output -raw autoscale_pool_id_green)"
          echo "health_url=$(terraform output -raw health_url)"
          echo "After apply, set GitHub env vars AUTOSCALE_POOL_ID_GREEN + ACTIVE_COLOR_TAG from outputs above."

      - name: Point LB at blue color tag (first cutover)
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y jq
          chmod +x deploy/scripts/*.sh
          export LOADBALANCER_ID="$(cd infra/terraform/environments/dev && terraform output -raw loadbalancer_id)"
          export BLUE_TAG="$(cd infra/terraform/environments/dev && terraform output -raw blue_tag)"
          # Tag existing shared-tag droplets with blue so LB can attach before template roll finishes.
          mapfile -t DROPLET_IDS < <(curl -fsS -H "Authorization: Bearer ${DIGITALOCEAN_TOKEN}" \
            "https://api.digitalocean.com/v2/droplets?tag_name=$(cd infra/terraform/environments/dev && terraform output -raw pool_tag)&per_page=200" \
            | jq -r '.droplets[].id')
          if [[ "${#DROPLET_IDS[@]}" -gt 0 ]]; then
            resources="$(printf '%s\n' "${DROPLET_IDS[@]}" | jq -R '{resource_id:., resource_type:"droplet"}' | jq -s '{resources:.}')"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${DIGITALOCEAN_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$resources" \
              "https://api.digitalocean.com/v2/tags/${BLUE_TAG}/resources" >/dev/null
            echo "Tagged ${#DROPLET_IDS[@]} droplet(s) with $BLUE_TAG"
          fi
          ./deploy/scripts/lb-set-tag.sh "$BLUE_TAG"

      - name: Export private DATABASE_URL + REDIS_URL
        if: inputs.wire_pool_database_url
        id: dburl
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          url="$(terraform output -raw database_url_private)"
          redis="$(terraform output -raw redis_url_private)"
          echo "::add-mask::$url"
          echo "::add-mask::$redis"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "redis=$redis" >> "$GITHUB_OUTPUT"
          echo "pool_tag=$(terraform output -raw pool_tag)" >> "$GITHUB_OUTPUT"

      - name: Wire DATABASE_URL + REDIS_URL on all pool hosts
        if: inputs.wire_pool_database_url
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          REDIS_URL: ${{ steps.dburl.outputs.redis }}
          POOL_TAG: ${{ steps.dburl.outputs.pool_tag }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y jq
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/ssh-pool.sh -- "$(cat <<EOF
          set -euo pipefail
          cd /opt/sailing-plans
          touch .env
          awk -v url="${DATABASE_URL}" -v redis="${REDIS_URL}" '
            BEGIN { db=0; rd=0 }
            /^DATABASE_URL=/ { print "DATABASE_URL=" url; db=1; next }
            /^REDIS_URL=/ { print "REDIS_URL=" redis; rd=1; next }
            { print }
            END {
              if (!db) print "DATABASE_URL=" url
              if (!rd) print "REDIS_URL=" redis
            }
          ' .env > .env.tmp && mv .env.tmp .env
          chmod 600 .env
          docker compose rm -sf db 2>/dev/null || true
          docker compose up -d --no-deps --force-recreate --remove-orphans api || true
          for i in \$(seq 1 30); do
            if curl -fsS http://127.0.0.1/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
          EOF
          )"
