name: Deploy Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/sailing-plans

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          sha_tag="${GITHUB_SHA::12}"
          echo "api_image=${IMAGE_PREFIX}-api:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "web_image=${IMAGE_PREFIX}-web:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "api_latest=${IMAGE_PREFIX}-api:latest" >> "$GITHUB_OUTPUT"
          echo "web_latest=${IMAGE_PREFIX}-web:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}
            ${{ steps.meta.outputs.api_latest }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ steps.meta.outputs.web_image }}
            ${{ steps.meta.outputs.web_latest }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: true

      - name: Copy compose files to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: /opt/sailing-plans
          strip_components: 1

      - name: Pull and restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,API_IMAGE,WEB_IMAGE
          script: |
            set -euo pipefail
            cd /opt/sailing-plans
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            export API_IMAGE WEB_IMAGE
            # Keep secrets from existing .env; refresh image pins
            grep -vE '^(API_IMAGE|WEB_IMAGE)=' .env > .env.tmp || true
            {
              cat .env.tmp
              echo "API_IMAGE=${API_IMAGE}"
              echo "WEB_IMAGE=${WEB_IMAGE}"
            } > .env
            rm -f .env.tmp
            chmod 600 .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            # Caddy/API need a moment after container start
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1/health; then
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            docker compose ps
            docker compose logs --tail=80
            exit 1
