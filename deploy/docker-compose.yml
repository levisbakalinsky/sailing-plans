# Development Droplet stack — images built/pushed by GitHub Actions (Ship (Development)).
# Postgres is DigitalOcean Managed DB (Terraform); not run on the Droplet.
services:
  api:
    image: ${API_IMAGE:-ghcr.io/levisbakalinsky/sailing-plans-api:dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_replace_me}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_replace_me}
    expose:
      - "8080"
    networks:
      - internal

  web:
    image: ${WEB_IMAGE:-ghcr.io/levisbakalinsky/sailing-plans-web:dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: development
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      # Publishable key is baked into the web image at build time; secret is runtime.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /portal
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /portal
    depends_on:
      - api
    expose:
      - "3000"
    networks:
      - internal

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
